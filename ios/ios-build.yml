name: iOS — сборка и загрузка в TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Выбор Xcode
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Ключ App Store Connect
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Сборка архива
        working-directory: ios
        run: |
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/private_keys/AuthKey_$ASC_KEY_ID.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild archive -project RuChat.xcodeproj -scheme RuChat -configuration Release -destination generic/platform=iOS -archivePath $RUNNER_TEMP/RuChat.xcarchive DEVELOPMENT_TEAM=$TEAM CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} $AUTH

      - name: Загрузка в App Store Connect
        run: |
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/private_keys/AuthKey_$ASC_KEY_ID.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          P=$RUNNER_TEMP/export.plist
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" $P
          /usr/libexec/PlistBuddy -c "Add :destination string upload" $P
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM" $P
          /usr/libexec/PlistBuddy -c "Add :signingStyle string automatic" $P
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/RuChat.xcarchive -exportOptionsPlist $P -exportPath $RUNNER_TEMP/out $AUTH
